name: spliit-dev
services:
  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spliit_dev -d spliit_dev"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
